# Project-wide Gradle settings.
# https://docs.gradle.org/current/userguide/build_environment.html

# JVM args for the Gradle daemon.
# Adjust heap to suit your machine. 2 GB is a safe baseline; CI uses 4 GB.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# Parallel project execution speeds up multi-module builds.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# AndroidX is mandatory for the entire Kornerz Android project.
android.useAndroidX=true

# Jetifier is left enabled (false) because none of our P0 dependencies
# ship with support-library artifacts. Flip to true only if a transitive
# dep forces it.
android.enableJetifier=false

# Kotlin code style for IDE consistency.
kotlin.code.style=official

# Non-transitive R class generation; smaller R classes, faster builds.
android.nonTransitiveRClass=true

# Disable build features by default for library modules that don't need them.
android.defaults.buildfeatures.buildconfig=true
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=true
android.defaults.buildfeatures.shaders=false