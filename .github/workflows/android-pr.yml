name: Android PR build

on:
  pull_request:
    paths:
      - 'KornerzAndroid/**'
      - '.github/workflows/android-pr.yml'

jobs:
  build:
    name: assembleDevDebug
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: KornerzAndroid

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.OS }}-gradle-${{ hashFiles('KornerzAndroid/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.OS }}-gradle-
            ${{ runner.OS }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build dev debug APK
        run: ./gradlew :app:assembleDevDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-dev-debug
          path: app/build/outputs/apk/dev/debug/*.apk
          if-no-files-found: error
          retention-days: 14